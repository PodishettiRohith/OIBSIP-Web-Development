<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    
    <!-- Register View -->
    <div id="register-view" class="auth-card">
      <h2>Create Account</h2>
      <p class="subtitle">Sign up to access your dashboard</p>
      
      <div id="register-error" class="alert error-alert" style="display: none;"></div>
      
      <form id="register-form">
        <div class="form-group">
          <label for="reg-username">Username or Email</label>
          <input type="text" id="reg-username" required placeholder="Enter username or email">
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="At least 8 chars & 1 number">
        </div>

        <button type="submit" class="btn-primary">Register</button>
      </form>

      <p class="switch-mode">Already have an account? <a href="#" id="to-login">Log In</a></p>
    </div>

    <!-- Login View -->
    <div id="login-view" class="auth-card" style="display: none;">
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to your account</p>

      <div id="login-error" class="alert error-alert" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username or Email</label>
          <input type="text" id="login-username" required placeholder="Enter username or email">
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="switch-mode">Don't have an account? <a href="#" id="to-register">Register</a></p>
    </div>

    <!-- Protected Dashboard View -->
    <div id="dashboard-view" class="auth-card" style="display: none;">
      <h2>User Dashboard</h2>
      <p class="subtitle">Access Granted (Protected Page)</p>
      
      <div class="user-info">
        <p>Logged in as: <strong id="active-user-display"></strong></p>
        <p class="status-tag">Session Active</p>
      </div>

      <button id="logout-btn" class="btn-danger">Logout</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
